<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito';
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #FFF9F0; 
            color: #5D5D5D;          
        }

        #container {
            font-size: 90px; 
            margin-bottom: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #E0E0E0;
        }
        button {
            padding: 15px 30px; 
            font-size: 20px; 
            margin: 10px;
            border-radius: 20px; 
            font-weight: bold;
            color: #444;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px 0px rgba(0,0,0,0.1);
            border: none;
        }
        
        button:active {
            transform: translateY(4px); 
            box-shadow: none;
        }

        .start { 
            background-color: #B0F2B4; 
        } 
        .stop  { 
            background-color: #FFB5B5; 
        } 
        .reset { 
            background-color: #BAE1FF; 
        } 

    </style>
</head>
<body>
    <div id="container">
        <span id="h">00</span>:<span id="m">00</span>:<span id="s">00</span>.<span id="ms">00</span>
    </div>
    <div>
        <button class="start" onclick="start()">Bắt đầu</button>
        <button class="stop" onclick="stop()">Dừng lại</button>
        <button class="reset" onclick="reset()">Đặt lại</button>
    </div>


    <script>
        let hours = 0;   
        let minutes = 0;
        let seconds = 0; 
        let miliseconds = 0;   
        let interval; 

        const addMiliseconds = document.getElementById("ms");     
        const addSeconds = document.getElementById("s"); 
        const addMinutes = document.getElementById("m"); 
        const addHours = document.getElementById("h");  

        function start() {
            clearInterval(interval); 
            interval = setInterval(runTimer, 10); 
        }

        function stop() {
            clearInterval(interval);
        }

        function reset() {
            clearInterval(interval); 
            miliseconds = 0; seconds = 0; minutes = 0; hours = 0;
            addMiliseconds.innerHTML = "00";
            addSeconds.innerHTML = "00";
            addMinutes.innerHTML = "00";
            addHours.innerHTML = "00";
        }

        function runTimer() {
            miliseconds++; 
            if (miliseconds > 99) {
                miliseconds = 0;   
                seconds++;  
            }
            if (seconds > 59) {
                seconds = 0;
                minutes++;  
            }
            if (minutes > 59) {
                minutes = 0; 
                hours++;     
            }

            if (miliseconds < 10) {
                addMiliseconds.innerHTML = "0" + miliseconds;
            } else {
                addMiliseconds.innerHTML = miliseconds;
            }
            if (seconds < 10) {
                addSeconds.innerHTML = "0" + seconds;
            } else {
                addSeconds.innerHTML = seconds;
            }
            if (minutes < 10) {
                addMinutes.innerHTML = "0" + minutes;
            } else {
                addMinutes.innerHTML = minutes;
            }
            if (hours < 10) {
                addHours.innerHTML = "0" + hours;
            } else {
                addHours.innerHTML = hours;
            }
        }
    </script>
</body>
</html>
